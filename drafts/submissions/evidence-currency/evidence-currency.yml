computational_requirements: >-
  CPU only, negligible cost. Python 3.11 or later and git 2.28 or later. No
  third-party Python packages; the code uses only the standard library. It
  needs a full checkout of the linked repository, because verdictLedger
  imports a shared module beside it. The worked example runs in under a
  minute.

