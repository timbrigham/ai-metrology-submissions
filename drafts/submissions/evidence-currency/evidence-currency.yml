computational_requirements: >-
  CPU only, negligible cost. Python 3.11 or later and git 2.28 or later; no
  third-party Python packages. Needs a full checkout of the linked repository,
  because the implementation imports a shared module that sits beside it. The
  worked example runs in a few seconds.

