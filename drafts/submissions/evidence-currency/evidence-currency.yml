usage_details: |
  Use it at a decision point (merge, release, deployment, re-certification)
  where an AI system's assurance case cites earlier test, evaluation or review
  results. Typical subjects are the files those results were computed on:
  prompt templates, guardrail and policy configurations, evaluation datasets
  and harness code, agent tool definitions, model cards. Typical steps are the
  evaluations and reviews required for each. The question it answers is: of
  the evidence this decision relies on, how much was produced against the
  exact bytes being shipped?

  It is most useful where content changes faster than checks are re-run. One
  example is agent-assisted development, in which code and configuration change
  many times between gate runs. Another is a long-lived assurance record whose
  subjects are edited after review. In both settings a pass recorded on earlier
  bytes can keep counting after the content changes. Binding each verdict to a
  content hash makes that visible as stale rather than current.

  The stale and never-examined counts give the remedy directly: stale subjects
  need a re-run, and never-examined subjects need a first run. A team can set a
  required currency per step (for example 100% for a safety evaluation, lower
  for an advisory check) without changing what is measured.

  Grounding: no peer-reviewed source we know of defines this exact measurement.
  Regression test selection (Gligoric et al., 2015) and build-system verifying
  traces (Mokhov et al., 2018) establish the underlying principle: a recorded
  result is valid only while the hashes of the exact content it was computed on
  are unchanged. Evidence currency applies that per-result validity predicate at
  decision time, as a measurement. It reports current, stale, never-examined and
  not-applicable counts separately rather than as one pass rate.

known_failure_modes: |
  1. Recorded, not re-run. The metric counts verdicts as recorded. It does not
     re-execute the checks, so a fabricated or mistaken record counts as
     current. It is only as trustworthy as whatever writes the records.
  2. Scope defines the denominator. If a step's declared scope omits files the
     check should cover, those files appear in no state, and currency can read
     100% while relevant content was never examined. Scope declarations need
     their own review.
  3. Checker changes are invisible. Only the subject files' bytes decide
     current versus stale. If the check itself changes (a new evaluator
     version, a different threshold), earlier verdicts stay current unless the
     checker's own files are declared as part of the step's scope.
  4. Content outside the tracked tree. Inputs the hash does not cover (remote
     model weights fetched at run time, external APIs, environment variables,
     random seeds) can change without making any verdict stale.
  5. Not a quality measure. 100% currency with every verdict a FAIL is
     possible. Read currency together with the pass/fail outcomes, never as a
     substitute for them.
  6. The aggregate hides structure. A high total can mask one critical step
     at low currency. Report per-step values, especially for safety-relevant
     steps.

