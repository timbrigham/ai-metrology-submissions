usage_details: |
  AI systems are released with claims attached: a model or system card states
  that a safety evaluation was run, an assurance case cites a red-team review,
  a release checklist records that the tool definitions were approved. Those
  claims are only as good as the evidence behind them, and that evidence was
  produced against particular versions of particular files. Evidence currency
  asks, at the release decision, how much of the evidence behind each claim
  was produced against the exact bytes being released.

  Example. An LLM application's release cites a safety evaluation run over
  `prompts/system.md`, `guardrails/policy.yaml`, `tools/search.json` and
  `evals/safety_set.jsonl`. Every recorded result is a PASS. After the run,
  the system prompt is edited and a new tool definition, `tools/browse.json`,
  is added. At release, the safety evaluation's currency is 3/5 (60%): one
  subject is stale (the edited prompt) and one was never examined (the new
  tool). Until the evaluation is re-run, the release's "evaluated for safety"
  claim describes a system that is no longer the one being shipped. A
  pass-only view of the same records reports 4 of 4 passing.

  The counts give the remedy directly: stale subjects need a re-run, and
  never-examined subjects need a first run. A team can require a currency per
  step (for example 100% for a safety evaluation, lower for an advisory check)
  without changing what is measured.

  Grounding: this is a new measurement. Its primary methodological
  specification is the worked example's README in the linked implementation.
  No peer-reviewed source we know of defines it. Its validity predicate (a
  recorded result holds only while the hashes of its exact inputs are
  unchanged) is the one used in regression test selection (Gligoric et al.,
  2015). Its decision-time, per-step check of recorded evidence against the
  hashes of the delivered artifacts, with missing steps detected as missing,
  follows in-toto (Torres-Arias et al., 2019). Evidence currency turns that
  check into a measurement: per-step counts of current, stale and
  never-examined evidence, rather than a single pass/fail.

known_failure_modes: |
  1. Recorded, not re-run. The metric counts verdicts as recorded. It does not
     re-execute the checks, so a fabricated or mistaken record counts as
     current. It is only as trustworthy as whatever writes the records.
  2. Scope defines the denominator. If a step's declared scope omits files the
     check depends on, those files appear in no state, and currency can read
     100% while relevant content was never examined. Scope declarations need
     their own review.
  3. Checker changes are invisible unless declared. Only the bytes of files in
     $S_s(r)$ decide current versus stale. If the check itself changes (a new
     evaluator version, a different threshold), earlier verdicts stay current
     unless the checker's own files are declared as dependencies of the step
     (in the reference implementation, `switches`).
  4. Content outside the tracked tree. Inputs the hash does not cover (model
     weights fetched at run time, remote APIs, environment variables, random
     seeds) can change without making any verdict stale. Datasets and weights
     stored as Git LFS or DVC pointer files are covered only to the extent the
     pointer's embedded content hash changes with them. That follows from the
     pointer format and is not exercised by the worked example.
  5. Not a quality measure. 100% currency with every verdict a FAIL is
     possible. Read currency together with outcomes, never as a substitute.
  6. The aggregate hides structure. A high total can mask one safety-relevant
     step at low currency. Report per-step values.

references:
  - >-
    Gligoric, M., Eloussi, L., & Marinov, D. (2015). "Practical Regression
    Test Selection with Dynamic File Dependencies." Proceedings of the 2015
    International Symposium on Software Testing and Analysis (ISSTA 2015),
    ACM, 211-222. https://doi.org/10.1145/2771783.2771784
  - >-
    Torres-Arias, S., Afzali, H., Kuppusamy, T. K., Curtmola, R., & Cappos,
    J. (2019). "in-toto: Providing farm-to-table guarantees for bits and
    bytes." 28th USENIX Security Symposium, 1393-1410.
    https://www.usenix.org/conference/usenixsecurity19/presentation/torres-arias

