schema_version: "1.0"

name: Evidence Currency

applied_definition: |
  Evidence currency measures, at the moment a release or deployment decision is
  made, whether the recorded verdicts behind that decision still describe the
  exact content being released. It does not measure whether that content passed.

  A *verdict* is a recorded result of a check (an automated test, a scanner, an
  evaluation run, a human review). Each verdict is bound to the step $s$ that
  produced it and, for every file it covers, to that file's path $p$ and the
  content hash of the bytes examined, $h$ (a git blob id). At a revision $r$, let
  $S_s(r)$ be the set of paths in step $s$'s declared scope, and $h_r(p)$ the
  content hash of path $p$ at $r$. Each pair $(s, p)$ with $p \in S_s(r)$ is in
  exactly one state:

  - **current**: a verdict exists for $(s, p, h_r(p))$;
  - **stale**: a verdict exists for $(s, p)$, but only at hashes other than
    $h_r(p)$, so the file has changed since it was examined;
  - **never examined**: no verdict exists for $(s, p)$ at any hash.

  Per step, with $n_s = |S_s(r)| = c_s + t_s + u_s$ (current, stale, never
  examined):

  $$\mathrm{currency}_s(r) = \frac{c_s}{n_s}$$

  The aggregate is computed over all (step, path) pairs of applicable steps:

  $$\mathrm{currency}(r) = \frac{\sum_s c_s}{\sum_s n_s}$$

  Reporting rules, all part of the method:

  1. $c_s$, $t_s$ and $u_s$ are always reported alongside the ratio, never
     only the ratio. Stale and never-examined content call for different
     remedies (re-run versus first run).
  2. A step with $n_s = 0$ is reported as **not applicable**, with currency
     undefined (null), and is excluded from the aggregate. An empty scope is
     never reported as 100%.
  3. A current verdict counts as current whether it recorded a pass or a fail.
     Currency is a property of the evidence, not of the outcome; pass rates
     are reported separately.

