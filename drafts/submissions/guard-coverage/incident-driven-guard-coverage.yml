usage_details: |
  Use it to monitor an AI agent deployment whose safety depends on tool-level
  guards. It applies security operations practice to agents: log, detect,
  respond, and add a regression test. It reports how complete and how fast
  that loop is.

  The threat model is proportionate: an agent that misbehaves under pressure
  but is not adversarial. The method makes no completeness claim. Guards are
  added for the patterns agents actually show, and the result states how much
  of what has been observed is covered, how quickly new patterns are absorbed,
  and an estimate of what has not yet been seen.

  The incident register is essential. A refusal log contains only patterns that
  are already guarded, so an unguarded pattern appears only when an allowed
  action is later found harmful. Incidents can also occur outside the mediated
  tools (for example through a general shell); only the register sees those.

  Example. TODO: replace with the worked example's actual output once it is
  built.

  This complements the AI Metrology Center's "Agent / Tool Abuse Testing",
  which generates attempts, and "Post-deployment Feedback", which collects
  incidents. Neither measures how fast observed patterns are absorbed into
  tested guards.

  Grounding: a newly proposed measurement. The unseen-pattern estimate applies
  the Good-Turing discovery probability, used as a residual-risk measure in
  software testing (Böhme, 2018), with the incidence model and the session as
  the sampling unit. Because adding guards changes the sampling process, counts
  restart at each version change, following Böhme et al. (2021), who show that
  estimators assuming a fixed distribution "systematically and substantially
  under-estimate the true risk" otherwise. The implementation is a
  single-author proof of concept used in one environment; it is not
  production-ready and has not been independently replicated.

known_failure_modes: |
  1. Unrecorded incidents are invisible. The guarded share is only as complete
     as the incident register; recording discipline is part of the method.
  2. The classification rule decides the counts. Two reasonable rules applied
     to the same refusal log produced 44 and 62 patterns. Declare and version
     the rule, and classify at the point of refusal, not afterwards from text.
  3. The guarded share rises with effort by construction. Read it with the
     ages of unguarded patterns and the unseen-pattern estimate.
  4. Small volume. Below the declared threshold the estimate is withheld; a
     small deployment may never reach it.
  5. Version changes. Counts from different agent, tool or guard versions are
     not pooled.
  6. Missing fields. Log records written before session or refusal-reason
     fields existed cannot be attributed; analyse those periods separately.

