schema_version: "1.0"

name: Incident-Driven Guard Coverage

applied_definition: |
  Measures, over time, how well the guards that mediate an AI agent's tool use
  keep up with the risky actions agents are actually observed to attempt. It
  measures the guard set and its maintenance, not the agent, and makes no claim
  that unobserved actions are covered.

  **Observations.** An observation is either:
  - an **incident**: an action the tools allowed that was later found harmful,
    recorded in an incident register; or
  - a **policy refusal**: an attempt refused because a guard exists to stop
    that action.

  Refusals for other reasons (a failed quality gate, a state conflict, a read
  outside an allow-list) are not observations. A declared, versioned
  classification rule maps each observation to a **pattern**.

  **Sampling unit and window.** The unit is an agent session. A pattern counts
  once per session in which it is observed. Counts are kept within a window of
  fixed agent, tool and guard versions, and restart when any of these changes,
  because adding a guard changes what agents attempt.

  At time $T$, let $K$ be the patterns observed so far, and $G \subseteq K$ the
  patterns that have both a guard and a regression test that replays the
  observed action through the agent's entry point and asserts it is refused.
  Report:

  1. **Guarded share** $|G|/|K|$, with both counts and every unguarded pattern
     listed with its age since first observation.
  2. **Time to guard**: for each guarded pattern, the time from its first
     observation to the commit that guards it; report the median.
  3. **Discovery trend**: new patterns per batch of sessions.
  4. **Unseen-pattern estimate**: within a window of $V$ sessions, with $Q_1$
     the patterns observed in exactly one session,

     $$\hat{U} = \frac{Q_1}{V}$$

     estimates the probability that the next session shows a pattern never
     observed before. It is reported only when $V \ge V_{min}$ and some pattern
     has been observed in exactly two sessions; otherwise it is withheld and
     only the counts are reported. $V_{min}$ is declared with the result.

