usage_details: |
  Use it to evaluate, in production, the control layer of an AI agent
  deployment whose safety depends on tool-level guards, against a misbehaving
  but not adversarial agent. It applies the security operations loop (log,
  detect, respond, add a regression test) and reports how complete and how
  fast that loop is. It makes no claim that unobserved actions are covered.

  Example. Real data from one deployment informs only item 1: 3 of 3 patterns
  guarded, two by tests added on the day measured; other values are lower
  bounds or withheld. A seeded synthetic replay (19% of windows reach
  $n \ge 100$) gives a bias of +0.0004 against $U_n$ (95% CI about 0 to
  0.0009), with RMSE 0.018 against a mean of 0.026.

  It complements the AI Metrology Center's "Agent / Tool Abuse Testing", which
  generates attempts, and "Post-deployment Feedback", which collects
  incidents. Neither measures how fast observed patterns are absorbed into
  tested guards.

  Grounding: a newly proposed measurement; items 1-3 are counts and
  durations. Item 4 is the Good-Turing discovery probability on incidence data
  (Böhme et al., 2021, Eq. 22), used to assess residual risk in software
  testing (Böhme, 2018; Böhme et al., 2021); per-version windows follow that
  paper's reset estimators, which over-estimate with high variance. $n \ge 100$
  is a convention: Robbins' bound for abundance data (mean squared error "less
  than 1/n", cited in Böhme, 2018) gives an RMSE below 0.1 there, loose
  against typical values (about 0.03 in the replay). The synthetic replay, one
  setting under the estimator's own assumptions, checks the implementation,
  not the method. The implementation is a single-author proof of concept used
  in one environment; it is not production-ready and has not been
  independently replicated.

known_failure_modes: |
  1. Unrecorded attempts are invisible. A refusal log holds only patterns
     already guarded, so unguarded patterns appear only through the incident
     register. $U_n$ scales with the recording rate: it does not bound
     unrecorded attempts, and a pattern behind a guard that does not log stops
     being recorded.
  2. The classification rule decides the counts: too fine inflates $Q_1$ and
     $\hat{U}$, too coarse hides variants. Declare and version the rule, and
     classify at the point of refusal, not afterwards from text.
  3. Detection lag. Recent sessions' incidents may not be found yet, which
     biases $Q_1$ low. Compute item 4 only over sessions older than a declared
     lag.
  4. Sessions are what the guard layer logs, typically a client connection,
     not a conversation. Sessions that never touch the guard layer are not in
     $n$.
  5. Versions are only what is logged. The reference implementation logs the
     guard layer's commit, the client's name and version and each guard's
     version history, but no model version, so a model change silently pools
     windows. Windows restart because adding a guard can change what agents
     attempt.
  6. The median in item 2 is optimistic: long lags gather more incidents, so
     they are more often lower bounds and left out.
  7. A pattern recorded only in an earlier window counts as unseen in a new
     one, so $\hat{U}$ errs high for patterns never seen at all.

