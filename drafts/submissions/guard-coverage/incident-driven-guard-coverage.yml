usage_details: |
  Use it to evaluate, in production, the control layer of an AI agent
  deployment whose safety depends on tool-level guards, against a misbehaving
  but not adversarial agent. It applies the security operations loop (log,
  detect, respond, add a regression test) and reports how complete and how
  fast that loop is. It makes no claim that unobserved actions are covered.

  Example. TODO: replace with one line of real-data output and one line of
  synthetic-replay results from the tagged worked example.

  It complements the AI Metrology Center's "Agent / Tool Abuse Testing", which
  generates attempts, and "Post-deployment Feedback", which collects
  incidents. Neither measures how fast observed patterns are absorbed into
  tested guards.

  Grounding: a newly proposed measurement; items 1-3 are plain counts and
  durations. Item 4 is the Good-Turing discovery probability on incidence data
  (Böhme et al., 2021, Eq. 22), used as a residual-risk measure in software
  testing (Böhme, 2018). Its threshold uses the bound that the mean squared
  error is "less than 1/n", applied by analogy. Window restarts follow the
  reset estimators of Böhme et al. (2021), which over-estimate (conservative
  for a bound) with high variance. The implementation is a single-author proof
  of concept used in one environment; it is not production-ready and has not
  been independently replicated.

known_failure_modes: |
  1. Unrecorded incidents are invisible. A refusal log holds only patterns
     already guarded, so unguarded patterns appear only through the incident
     register, and recording discipline is part of the method.
  2. The classification rule decides the counts: too fine inflates $Q_1$ and
     $\hat{U}$, too coarse hides variants. Declare and version the rule, and
     classify at the point of refusal, not afterwards from text.
  3. Detection lag. Recent sessions' incidents may not be found yet, which
     biases $Q_1$ low. Compute item 4 only over sessions older than a declared
     lag.
  4. Sessions are what the guard layer logs, typically a client connection,
     not a conversation. Sessions that never touch the guard layer are not in
     $n$.
  5. Versions are what the client reports. A model change the client does not
     report silently pools windows.

