usage_details: |
  Use it to evaluate, in production, the control layer of an AI agent
  deployment whose safety depends on tool-level guards, against a misbehaving
  agent that does not adapt to evade them. It applies the security operations
  loop (log, detect, respond, add a regression test) and reports how complete
  and how fast that loop is. It makes no claim that unobserved actions are covered.

  Example. On real data, 1 of 3 patterns had a tested guard before the day
  measured and 3 of 3 after; one, blocked by a hook committed the day after
  its first record, waited at least 51.9 days for a replaying test; the
  median and item 4 are withheld. In a synthetic replay, for windows with
  $n \ge 100$ (19% of windows, 64% of sessions), $\hat{U}$ has near-zero
  absolute bias but an RMSE about 70% of its mean.

  Grounding: a newly proposed measurement; items 1-3 are counts and
  durations. Item 4 is the Good-Turing discovery probability on incidence data
  (Böhme et al., 2021, Eq. 22), used to assess residual risk in software
  testing (Böhme, 2018). The synthetic replay, one setting under the
  estimator's own assumptions, checks the implementation, not the method. The
  implementation is a single-author proof of concept used in one environment;
  it is not production-ready and has not been independently replicated.

known_failure_modes: |
  1. Unrecorded attempts are invisible. A refusal log holds only patterns
     already guarded, so unguarded patterns appear only through the incident
     register. $U_n$ scales with the recording rate and does not bound
     unrecorded attempts.
  2. The classification rule decides the counts: too fine inflates $Q_1$ and
     $\hat{U}$, too coarse hides variants. Declare and version the rule, and
     classify at the point of refusal, not afterwards from text.
  3. Detection lag and missing sessions bias $Q_1$ low: recent incidents may
     not be found yet, and incidents with no known session are left out of
     $Q_1$ while their sessions stay in $n$. Restrict item 4 to sessions older
     than a declared lag.
  4. Sessions are what the guard layer logs, typically a client connection,
     not a conversation. Sessions that never touch the guard layer are not in
     $n$.
  5. A model change or a change to an agent's instructions that is not logged
     as a version silently pools windows.
  6. The median in item 2 is optimistic: long lags gather more incidents, so
     they are more often lower bounds and left out. A pattern detected only
     when its guard was built has a time to guard of zero, which says nothing.
  7. A pattern recorded only in an earlier window counts as unseen in a new
     one, so $\hat{U}$ overstates the chance of a pattern never seen in any
     window; restarted windows behave like the reset estimators of Böhme et
     al. (2021), which over-estimate with high variance.

