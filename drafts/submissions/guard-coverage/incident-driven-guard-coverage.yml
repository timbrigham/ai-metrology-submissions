schema_version: "1.0"

name: Incident-Driven Guard Coverage

applied_definition: |
  Measures how well regression-tested guards on an AI agent's tool use keep up
  with the risky actions agents are observed to attempt.

  **Observations.** An observation is either:
  - an **incident**: an action the tools allowed that was later found harmful,
    recorded in an incident register; or
  - a **policy refusal**: an attempt refused by a guard in the declared guard
    set, logged with its session and refusal reason.

  A guard that does not log its refusals contributes no refusal observations.
  Refusals for other reasons (a failed quality gate, a state conflict, a read
  outside an allow-list) are not observations. A declared, versioned
  classification rule maps each observation to a **pattern**.

  **Unit and window.** The unit is an agent session, identified by the session
  id the guard layer logs. A pattern counts once per session, whether it was
  seen as an incident, a refusal or both. An incident whose session is
  unknown (for example, one that went through a general shell) counts toward
  $K$ and $G$ but not toward item 4.

  Let $K$ be the patterns observed so far, and $G \subseteq K$ those with a
  guard and a regression test that replays the observed action through the
  same entry point and asserts it is refused. Items 1-3 are cumulative:

  1. **Guarded share** $|G|/|K|$, with both counts and each unguarded pattern
     listed with its age.
  2. **Time to guard**: for each guarded pattern, from first occurrence to the
     first commit at which both the guard and its regression test are in
     place; report the median. When the occurrence time is
     unknown, measure from detection, mark the value as a lower bound and leave
     it out of the median.
  3. **Discovery trend**: new patterns per batch of sessions.
  4. **Unseen-pattern bound**: within a window of $n$ sessions with fixed
     agent, tool and guard versions (every session counts, including those with
     no observation), with $Q_1$ the patterns seen in exactly one session,

     $$\hat{U} = \frac{Q_1}{n}$$

     estimates the expected number of never-observed patterns in the next
     session, an upper bound on the probability that it shows one. Report it
     with $n$, $Q_1$ and $Q_2$, and only when $n \ge 100$; otherwise report the
     counts alone. The window restarts when any version changes, because adding
     a guard can change what agents attempt.

