usage_details: |
  Use it when a deployment relies on claims about what an agent cannot do,
  such as a git tool without force-push, a shell tool confined to a workspace,
  or a read-only database tool. Such claims are often documented without any
  test that attempts the action.

  The failure it targets, observed in the submitter's own project: an agent
  asked to leave a repository as it found it ran `git reset --hard` three
  times, destroying an uncommitted edit. It then reported, accurately, that
  the tracked tree was clean. A restriction against that counts as verified
  only when an attempt through each surface the agent can reach is refused
  and the edit is confirmed intact.

  The threat model is deliberately proportionate: an agent that misbehaves
  under pressure, treating a refusal as an obstacle, but is not acting
  adversarially. Against that, covering the few common forms of each
  forbidden action is enough to be useful, and exhaustive hardening is not
  the goal. The method makes that scope explicit, because the attempts are
  part of the result, instead of letting "enforced" imply completeness.

  The AI Metrology Center's "Agent / Tool Abuse Testing" asks whether a system
  misuses its tools, typically using red-team cases. This method is narrower:
  its denominator is the system's own claimed restrictions, and it checks
  whether each one is enforced, with no model in the loop.

  Grounding: this is a new measurement, applied so far to one system (the
  worked example). Martin & Xie (2007)
  define rule coverage for access-control policies as "the number of covered
  rules divided by the number of total rules". El Kateb et al. (2013) test
  whether enforcement points actually deny what a policy specifies, comparing
  runs under the original and a mutated rule. This method takes its
  denominator from the first, and its attempt-and-control test from the
  second.
  The reference implementation is a single-author proof of concept, built
  for and used in one dedicated environment. It demonstrates the measurement;
  it is not a production or complete tool, and it has not been independently
  replicated or adopted elsewhere.

known_failure_modes: |
  1. The claimant chooses $R$. A narrow $R$ inflates the rates, so publish
     $|R|$ and its source.
  2. Unlisted surfaces. If the agent can reach the same effect another way (a
     general shell, a second tool), restrictions can verify on every listed
     surface and still be bypassed.
  3. Unreachable test seams. An attempt through an internal check function,
     not the entry point the agent calls, does not count as $E$.
  4. Proportionate, not adversarial. The rate holds only for the listed
     attempts. Forms outside the list, and deliberate circumvention, are out
     of scope.
  5. "Intact" means only what the state check inspects.
  6. Point in time. Re-run whenever the mediating layer changes.

