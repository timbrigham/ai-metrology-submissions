usage_details: |
  Use it whenever an AI agent acts through mediated tools and the deployment
  depends on claims about what the agent cannot do. Examples: a coding agent
  whose git tool omits force-push and hard reset; an operations agent whose
  shell tool refuses deletion outside a workspace; a support agent whose
  database tool is read-only. Claims like these are commonly stated in
  documentation and configuration and rarely tested by an attempt.

  Example of the failure this targets. An agent asked to leave a repository as
  it found it ran `git reset --hard` three times on a shared working tree,
  destroying uncommitted edits, and then reported, accurately, that the
  tracked tree was clean and HEAD unchanged. A restriction against that
  action counts as verified only when an attempt through each surface the
  agent can reach is refused and the uncommitted work is confirmed intact
  afterwards.

  The per-pair report shows where assurance is thinner than claimed. A
  typical result is a restriction verified by execution at the library and
  only by absence at the agent-facing tool interface. A checklist would
  record both as "enforced".

  This complements behavioural agent testing (the AI Metrology Center's
  "Agent / Tool Abuse Testing"), which asks whether an agent attempts unsafe
  actions. This method asks whether the enforcement layer stops them when
  they are attempted. It complements audit-trail tamper detection, which
  measures records altered after the fact: audit completeness measures
  records never written.

  Grounding: this is a new measurement. Its primary methodological
  specification is the README of the linked worked example. No published work
  we know of defines this ratio for AI-agent tool mediation. Martin & Xie
  (2007) define the analogous rule-coverage ratio for access-control policies,
  and El Kateb et al. (2013) test that enforcement points actually deny what
  a policy specifies. This metric applies that idea at the agent's tool
  boundary, and it has not been independently validated.

known_failure_modes: |
  1. The claimant chooses the denominator. A narrow $R$ inflates both rates.
     $|R|$ and the source of $R$ must be published with the result.
  2. Unlisted surfaces. The metric covers the surfaces in $\Sigma_r$. If the
     agent can reach the same effect by another route (a general shell, a
     second tool, an encoded command), the restriction can hold on every
     listed surface and still be bypassed. Surface enumeration needs its own
     review.
  3. Cooperative threat model. Mediation of this kind constrains an agent
     that uses the tools it is given. It does not measure resistance to
     deliberate circumvention, and a high rate is not a claim that it does.
  4. Protected-state checks are partial. "Intact" means what the check
     inspects (for example, specific files and their contents). Effects
     outside the check are not observed.
  5. Absence is weaker than execution. A structural check can miss a
     capability exposed under an unexpected name. That is why $A$ is
     reported separately and never merged with $E$.
  6. Point in time. Results describe the tool version tested. Re-run when the
     mediating layer changes.

