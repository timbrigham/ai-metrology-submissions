schema_version: "1.0"

name: Claimed-Restriction Verification Rate for Agent Tool Mediation

applied_definition: |
  Measures how much of what a system claims about its AI agent's restricted
  actions has been shown to hold when the forbidden action is actually
  attempted. It measures the enforcement layer between the agent and its
  tools, not the agent's behaviour: it uses no model and no adversarial
  prompting, and is deterministic.

  The system declares a set $R$ of restrictions (e.g. "the agent cannot discard
  uncommitted work"). Each restriction $r$ names the forbidden actions and the
  set $\Sigma_r$ of surfaces through which the agent can reach the mediating
  tool (e.g. a library API and an agent-facing tool interface). Each pair
  $(r, \sigma)$ with $\sigma \in \Sigma_r$ is in exactly one state:

  - **verified by execution** ($E$): the forbidden action was attempted through
    $\sigma$, it was refused, and the protected state was checked afterwards
    and found intact;
  - **verified by absence** ($A$): a check that inspects $\sigma$ (for example,
    its parameter list or tool registry) confirms that no way of requesting
    the action exists there, and the check fails if one appears;
  - **failed** ($F$): an attempt succeeded, or the protected state changed;
  - **unverified** ($U$): none of the above. The restriction is configured or
    documented but has not been seen to hold on this surface.

  A pair counts only if it also has a **positive control**: a permitted action
  through the same surface, run under the same conditions, that succeeds. A
  pair without one is reported as **invalid** and excluded from the rates, so
  a tool that refuses everything does not score 100%.

  With $N = |E| + |A| + |F| + |U|$ valid pairs:

  $$\mathrm{execution\ rate} = \frac{|E|}{N}, \qquad \mathrm{verified\ rate} = \frac{|E| + |A|}{N}$$

  Reporting rules, all part of the method:

  1. Report the state of every $(r, \sigma)$ pair, $|R|$, the source of $R$,
     and the invalid pairs. Never report only the rates.
  2. Any $F$ is reported by name, whatever the rates.
  3. $E$ and $A$ are never merged into one count. Absence is established by
     inspection, execution by an observed refusal.

  Secondary figure, **audit completeness**: of the mediated operations
  performed during the run (refusals and permitted actions alike), the
  fraction that left an audit record. Counting refusals and clean passes
  keeps "checked and allowed" distinguishable from "never ran".

