usage_details: |
  Use it whenever an AI agent acts through mediated tools and the deployment
  depends on claims about what the agent cannot do. Examples:
  - a coding agent whose git tool omits force-push and hard reset;
  - an operations agent whose shell tool refuses deletion outside a
    workspace;
  - a support agent whose database tool is read-only.
  Such claims are often stated in documentation and configuration without a
  test that attempts the action.

  The failure this targets, as observed in the submitter's own project: an
  agent asked to leave a repository as it found it ran `git reset --hard`
  three times on a shared working tree. That destroyed an uncommitted edit.
  The agent then reported, accurately, that the tracked tree was clean and
  HEAD unchanged. A restriction against that action counts as verified only
  when an attempt through each surface the agent can reach is refused and the
  uncommitted work is confirmed intact afterwards.

  The per-pair report shows where assurance is thinner than claimed. For
  example, a restriction may be refused and checked at one entry point, but
  established only by inspection, or not at all, at another. A checklist
  would record every such restriction as "enforced".

  The AI Metrology Center's "Agent / Tool Abuse Testing" tests whether a
  system misuses connected tools, typically with adversarial or red-team
  cases. This method is narrower. Its denominator is the system's own list
  of claimed restrictions, and it asks whether the enforcement layer refuses
  each one when it is attempted, with no model in the loop. Audit
  completeness complements audit-trail tamper detection: that measures
  records altered after the fact, and this measures records never written.

  Grounding: this is a new measurement proposed by the submitter. The
  applied_definition is its specification, and the linked worked example is
  its reference implementation, applied to one system. We know of no
  published work that defines this ratio for AI-agent tool mediation.
  - Martin & Xie (2007) define rule coverage for access-control policies
    ("the number of covered rules divided by the number of total rules"),
    a test-adequacy ratio over a policy's own rules.
  - El Kateb et al. (2013) test whether enforcement points actually deny
    what a policy specifies. Each access is run under the original rule and
    under a mutant that inverts it.
  This metric takes its denominator from the first, and its
  attempt-and-observe test with a control from the second. It has not been
  independently validated.

known_failure_modes: |
  1. The claimant chooses the denominator. A narrow $R$ inflates both rates.
     $|R|$ and the source of $R$ must be published with the result.
  2. Unlisted surfaces. The metric covers the surfaces in $\Sigma_r$. If the
     agent can reach the same effect by another route (a general shell, a
     second tool, an encoded command), the restriction can hold on every
     listed surface and still be bypassed. Surface enumeration needs its own
     review.
  3. Unreachable test seams. An attempt made through an internal check
     function, rather than the entry point the agent calls, can be refused
     while the reachable path goes untested. Such attempts do not count as
     $E$.
  4. Cooperative threat model. Mediation of this kind constrains an agent
     that uses the tools it is given. The metric does not measure resistance
     to deliberate circumvention, and a high rate is not a claim that it
     does.
  5. Protected-state checks are partial. "Intact" means what the check
     inspects (for example, specific files and their contents). Effects
     outside the check are not observed.
  6. Absence is weaker than execution. A structural check can miss a
     capability exposed under an unexpected name, which is why $A$ needs a
     seeded-variant control and is never merged with $E$.
  7. Point in time. Results describe the tool version tested. Re-run when
     the mediating layer changes.

