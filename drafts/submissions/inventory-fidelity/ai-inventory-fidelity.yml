usage_details: |
  Governance practice asks organisations to keep an inventory of their AI
  systems (for example, NIST AI RMF GOVERN 1.6: "Mechanisms are in place to
  inventory AI systems"). It does not say how to tell whether that inventory
  is true. This method answers that question at a point in time: does the
  inventory describe what is actually running?

  Use it at release, at deployment, and periodically in operation. Its value
  is highest for the components that conventional software bills of
  materials do not cover and that change most often in AI systems: prompt
  templates, tool definitions, guardrail configurations, and pinned model and
  dataset digests.

  The five classes call for different follow-up:
  - **modified**: content changed under a registered name, the AI
    supply-chain substitution case. Review the change, then re-register.
  - **vanished**: a registered component is no longer deployed. Retire it or
    restore it.
  - **phantom**: a deployed component was never registered. Register and
    review it.
  - **resurrected**: a retired component has reappeared. Investigate.

  Example: an agent's inventory lists a system prompt, two tool definitions
  and a guardrail policy. The deployed artifact has an edited system prompt,
  the two tools, an unregistered third tool, and no guardrail policy. The
  counts are matched 2, modified 1, vanished 1, phantom 1, resurrected 0.
  Precision is 2/4 and recall is 2/4.

  Grounding: this is a new measurement for AI-system inventories. Its primary
  methodological specification is the README of the linked worked example.
  The underlying measurement is identity-keyed precision and recall of a
  claimed component list against observed ground truth, as used to evaluate
  software bills of materials (Balliu et al., 2023; Yu et al., 2024). This
  method's extensions are the AI-specific component scope, matching on
  content hash as well as name, and the separately reported classes.

known_failure_modes: |
  1. The scan defines ground truth. Components the scanner cannot see
     (loaded at run time, fetched from a remote registry, built in memory)
     count as neither present nor phantom. Scanner coverage needs its own
     review and must be stated with the result.
  2. Identity conventions matter. Inconsistent naming between inventory and
     scan inflates vanished and phantom together. A recorded rename avoids
     this; an unrecorded one is deliberately not guessed.
  3. The hash covers only what is hashed. A model referenced by name and tag
     rather than by digest can change without becoming "modified".
     Reference models and datasets by content digest.
  4. Point in time. Fidelity describes the artifact scanned. A different
     environment (staging versus production) needs its own scan.
  5. Fidelity is not quality. A perfectly accurate inventory of an unsafe
     system scores 100%.

