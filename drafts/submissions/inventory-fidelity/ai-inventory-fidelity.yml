schema_version: "1.0"

name: AI Inventory Fidelity

applied_definition: |
  Measures whether an organisation's inventory of the components of an AI
  system describes what is actually deployed or released. It does so by
  reconciling the inventory against a scan of the artifact, keyed on identity
  and content.

  The inventory $I$ holds active entries (name $n$, content hash $h$) for the
  system's components: prompt templates, tool definitions, guardrail and policy
  configurations, and model and dataset references by digest. It also lists
  retired names. A scan of the artifact yields the set $P$ of present
  components (name, hash). Each name is in exactly one class:

  - **matched**: active in $I$ and present in $P$ with the same hash;
  - **modified**: active in $I$ and present in $P$ under the same name, but
    with a different hash, so the registered content is not what is deployed;
  - **vanished**: active in $I$, absent from $P$;
  - **phantom**: present in $P$, absent from $I$ (neither active nor retired);
  - **resurrected**: retired in $I$, present in $P$.

  With $m$ matched, $d$ modified, $v$ vanished, $p$ phantom and $z$ resurrected:

  $$\mathrm{inventory\ precision} = \frac{m}{m + d + v}, \qquad \mathrm{inventory\ recall} = \frac{m}{m + d + p + z}$$

  Precision is the share of active inventory entries that correctly describe
  something deployed. Recall is the share of deployed components that the
  inventory correctly describes.

  Reporting rules, all part of the method:

  1. All five counts are reported, with the names in every class other than
     matched. Never report only the ratios.
  2. Reconciliation never resolves a mismatch silently. A rename with no
     recorded rename appears as one vanished plus one phantom.
  3. Measuring does not change the inventory. The reconciliation is
     read-only.

