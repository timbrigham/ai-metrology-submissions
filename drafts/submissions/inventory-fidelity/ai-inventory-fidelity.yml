schema_version: "1.0"

name: AI Inventory Fidelity

applied_definition: |
  Measures whether an inventory of an AI system's components (prompt templates,
  tool definitions, guardrail and policy configurations, and model and dataset
  references by digest) describes what is actually deployed. It reconciles the
  inventory against a scan of the deployed artifact, without modifying the
  inventory.

  The inventory $I$ maps each active name to a content hash and lists retired
  names; a name may not be both. The scan yields $P$, mapping each present name
  to a hash. Names must be unique in $I$ and in $P$. A duplicate, a scanned item
  with no name, or a reference with no content digest is reported as an error,
  not classified. Hashes are SHA-256 over a canonical form declared for each
  component type, and the same form is used at registration and at scan. Every
  name in $I \cup P$ falls in exactly one class:

  - **matched**: active, present, same hash;
  - **modified**: active, present, different hash;
  - **vanished**: active, absent;
  - **phantom**: present, not in $I$;
  - **resurrected**: retired, present;
  - **retired-absent**: retired, absent (correct; not counted).

  With counts $m, d, v, p, z$:

  $$\mathrm{precision} = \frac{m}{m+d+v}, \qquad \mathrm{recall} = \frac{m}{m+d+p+z}$$

  Either ratio is undefined when its denominator is 0. The five counts and the
  names in every non-matched class are always reported with the ratios.

